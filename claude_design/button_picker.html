<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Material UI — Button Color Picker</title>
<style>
  :root {
    --page-bg: #f4f5f7;
    --card-bg: #ffffff;
    --ink: #1a1a1a;
    --ink-soft: #6b7280;
    --line: #e5e7eb;
    --radius: 10px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Roboto, 'Helvetica Neue', Arial, system-ui, sans-serif;
    background: var(--page-bg);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Top bar ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    background: rgba(255,255,255,0.86);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
    padding: 16px 28px;
    display: flex; flex-wrap: wrap; align-items: center; gap: 20px;
  }
  .topbar h1 { font-size: 21px; font-weight: 700; margin: 0; letter-spacing: -0.02em; }
  .topbar h1 span { color: var(--ink-soft); font-weight: 500; }
  .controls { display: flex; gap: 18px; flex-wrap: wrap; margin-left: auto; align-items: center; }
  .control-group { display: flex; flex-direction: column; gap: 5px; }
  .control-label { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--ink-soft); }
  .seg { display: inline-flex; background: #eceef1; border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button {
    border: 0; background: transparent; cursor: pointer;
    font: inherit; font-size: 13px; font-weight: 600; color: var(--ink-soft);
    padding: 5px 13px; border-radius: 6px; transition: all .15s;
  }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }

  /* ---------- Layout ---------- */
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px; }
  .hint { font-size: 13px; color: var(--ink-soft); margin: 0 0 22px; }
  .hint b { color: var(--ink); font-weight: 600; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 18px; }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px;
    transition: background .2s, border-color .2s;
  }
  .card-head { display: flex; align-items: center; gap: 10px; margin-bottom: 18px; }
  .swatch { width: 26px; height: 26px; border-radius: 7px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.08); flex: none; }
  .card-name { font-size: 15px; font-weight: 700; }
  .hexchip {
    margin-left: auto; font-family: ui-monospace, 'SF Mono', 'Cascadia Code', Consolas, monospace;
    font-size: 12px; font-weight: 600; color: var(--ink-soft);
    background: #f3f4f6; border-radius: 6px; padding: 3px 8px; cursor: pointer;
    border: 1px solid transparent; transition: all .15s;
  }
  .hexchip:hover { border-color: var(--line); color: var(--ink); }

  .variant-row { display: flex; align-items: center; gap: 12px; padding: 9px 0; }
  .variant-row + .variant-row { border-top: 1px dashed var(--line); }
  .variant-label { font-size: 11px; color: var(--ink-soft); width: 74px; flex: none; font-weight: 600; }
  .btn-slot { flex: 1; display: flex; }

  /* ---------- MUI button reproduction ---------- */
  .mui-btn {
    font-family: inherit; font-weight: 500; letter-spacing: 0.02em;
    text-transform: uppercase; border-radius: 4px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center;
    transition: background-color .2s, box-shadow .2s, border-color .2s;
    background: var(--bg); color: var(--fg); border: var(--bd);
    white-space: nowrap;
  }
  .mui-btn:hover { background: var(--bg-h); border: var(--bd-h); }
  .mui-btn:active { transform: translateY(0.5px); }
  .mui-btn.contained { box-shadow: 0 1px 5px rgba(0,0,0,.12), 0 2px 2px rgba(0,0,0,.14), 0 3px 1px -2px rgba(0,0,0,.2); }
  .mui-btn.contained:hover { box-shadow: 0 2px 4px -1px rgba(0,0,0,.2), 0 4px 5px 0 rgba(0,0,0,.14), 0 1px 10px 0 rgba(0,0,0,.12); }

  /* sizes */
  .sz-large  { padding: 8px 22px; font-size: 15px; line-height: 1.73; }
  .sz-medium { padding: 6px 16px; font-size: 14px; line-height: 1.75; }
  .sz-small  { padding: 4px 10px; font-size: 13px; line-height: 1.69; }
  .mui-btn.text.sz-large  { padding: 8px 11px; }
  .mui-btn.text.sz-medium { padding: 6px 8px; }
  .mui-btn.text.sz-small  { padding: 4px 5px; }

  /* ---------- Dark surface ---------- */
  body.dark { --page-bg: #101216; --card-bg: #181b20; --ink: #f3f4f6; --ink-soft: #9aa1ab; --line: #2a2e35; }
  body.dark .topbar { background: rgba(24,27,32,0.86); }
  body.dark .seg { background: #23272e; }
  body.dark .seg button.on { background: #363b44; color: #fff; }
  body.dark .hexchip { background: #23272e; }

  /* ---------- Toast ---------- */
  .toast {
    position: fixed; bottom: 26px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1a1a1a; color: #fff; padding: 11px 20px; border-radius: 9px;
    font-size: 13px; font-weight: 600; box-shadow: 0 8px 30px rgba(0,0,0,.25);
    opacity: 0; pointer-events: none; transition: all .25s; z-index: 50;
    display: flex; align-items: center; gap: 10px;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .toast .dot { width: 14px; height: 14px; border-radius: 4px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); }
  .toast code { font-family: ui-monospace, Consolas, monospace; }
</style>
</head>
<body>
  <div class="topbar">
    <h1>Material UI Buttons <span>· เลือกสีปุ่ม</span></h1>
    <div class="controls">
      <div class="control-group">
        <span class="control-label">ขนาด</span>
        <div class="seg" id="sizeSeg">
          <button data-size="large" class="on">Large</button>
          <button data-size="medium">Medium</button>
          <button data-size="small">Small</button>
        </div>
      </div>
      <div class="control-group">
        <span class="control-label">พื้นหลัง</span>
        <div class="seg" id="surfSeg">
          <button data-surf="light" class="on">Light</button>
          <button data-surf="dark">Dark</button>
        </div>
      </div>
    </div>
  </div>

  <div class="wrap">
    <p class="hint">คลิกปุ่มใดก็ได้เพื่อ <b>คัดลอกโค้ดสี</b> · เลื่อนเมาส์เพื่อดูสถานะ hover จริง · สลับขนาดและพื้นหลังได้จากด้านบน</p>
    <div class="grid" id="grid"></div>
  </div>

  <div class="toast" id="toast"><span class="dot"></span><span id="toastText"></span></div>

<script>
  const COLORS = [
    { name: 'Primary',   main: '#1976D2', dark: '#1565C0', fg: '#ffffff' },
    { name: 'Secondary', main: '#9C27B0', dark: '#7B1FA2', fg: '#ffffff' },
    { name: 'Success',   main: '#2E7D32', dark: '#1B5E20', fg: '#ffffff' },
    { name: 'Error',     main: '#D32F2F', dark: '#C62828', fg: '#ffffff' },
    { name: 'Warning',   main: '#EF6C00', dark: '#E65100', fg: '#ffffff' },
    { name: 'Info',      main: '#0288D1', dark: '#01579B', fg: '#ffffff' },
    { name: 'Inherit',   main: '#E0E0E0', dark: '#D5D5D5', fg: 'rgba(0,0,0,0.87)' },
  ];

  const VARIANTS = ['contained', 'outlined', 'text'];
  let size = 'large';

  function hexToRgb(hex) {
    const h = hex.replace('#', '');
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16));
  }
  function rgba(hex, a) { const [r, g, b] = hexToRgb(hex); return `rgba(${r},${g},${b},${a})`; }

  function neutralInk() { return document.body.classList.contains('dark') ? '#ffffff' : 'rgba(0,0,0,0.87)'; }
  function neutralLine() { return document.body.classList.contains('dark') ? 'rgba(255,255,255,0.23)' : 'rgba(0,0,0,0.23)'; }
  function neutralHover() { return document.body.classList.contains('dark') ? 'rgba(255,255,255,0.08)' : 'rgba(0,0,0,0.04)'; }

  function styleFor(c, variant) {
    const isInherit = c.name === 'Inherit';
    if (variant === 'contained') {
      return {
        bg: c.main, fg: isInherit ? 'rgba(0,0,0,0.87)' : c.fg,
        bgH: c.dark, bd: '0px solid transparent', bdH: '0px solid transparent',
      };
    }
    // outlined / text share foreground = the role color (inherit -> neutral ink)
    const ink = isInherit ? neutralInk() : c.main;
    if (variant === 'outlined') {
      return {
        bg: 'transparent', fg: ink, bgH: isInherit ? neutralHover() : rgba(c.main, 0.04),
        bd: `1px solid ${isInherit ? neutralLine() : rgba(c.main, 0.5)}`,
        bdH: `1px solid ${isInherit ? neutralLine() : c.main}`,
      };
    }
    // text
    return {
      bg: 'transparent', fg: ink, bgH: isInherit ? neutralHover() : rgba(c.main, 0.04),
      bd: '0px solid transparent', bdH: '0px solid transparent',
    };
  }

  function makeBtn(c, variant) {
    const s = styleFor(c, variant);
    const b = document.createElement('button');
    b.className = `mui-btn ${variant} sz-${size}`;
    b.textContent = c.name === 'Inherit' ? 'Button' : c.name;
    b.style.setProperty('--bg', s.bg);
    b.style.setProperty('--fg', s.fg);
    b.style.setProperty('--bg-h', s.bgH);
    b.style.setProperty('--bd', s.bd);
    b.style.setProperty('--bd-h', s.bdH);
    b.addEventListener('click', () => copyColor(c, variant));
    return b;
  }

  function buildCard(c) {
    const card = document.createElement('div');
    card.className = 'card';

    const head = document.createElement('div');
    head.className = 'card-head';
    head.innerHTML =
      `<span class="swatch" style="background:${c.main}"></span>` +
      `<span class="card-name">${c.name}</span>` +
      `<span class="hexchip" title="คัดลอก">${c.main}</span>`;
    head.querySelector('.hexchip').addEventListener('click', () => copyColor(c, 'main'));
    card.appendChild(head);

    VARIANTS.forEach(v => {
      const row = document.createElement('div');
      row.className = 'variant-row';
      const lbl = document.createElement('span');
      lbl.className = 'variant-label';
      lbl.textContent = v.charAt(0).toUpperCase() + v.slice(1);
      const slot = document.createElement('div');
      slot.className = 'btn-slot';
      slot.appendChild(makeBtn(c, v));
      row.appendChild(lbl);
      row.appendChild(slot);
      card.appendChild(row);
    });
    return card;
  }

  function render() {
    const grid = document.getElementById('grid');
    grid.innerHTML = '';
    COLORS.forEach(c => grid.appendChild(buildCard(c)));
  }

  let toastTimer;
  function copyColor(c, variant) {
    const val = variant === 'contained' || variant === 'main' ? c.main : c.main;
    navigator.clipboard && navigator.clipboard.writeText(val);
    const t = document.getElementById('toast');
    document.querySelector('#toast .dot').style.background = c.main;
    const role = variant === 'main' ? '' : ` · ${variant}`;
    document.getElementById('toastText').innerHTML =
      `คัดลอกแล้ว: <b>${c.name}</b>${role} → <code>${val}</code>`;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.remove('show'), 1900);
  }

  document.getElementById('sizeSeg').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    size = btn.dataset.size;
    [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === btn));
    render();
  });
  document.getElementById('surfSeg').addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn) return;
    document.body.classList.toggle('dark', btn.dataset.surf === 'dark');
    [...e.currentTarget.children].forEach(b => b.classList.toggle('on', b === btn));
    render();
  });

  render();
</script>
</body>
</html>
